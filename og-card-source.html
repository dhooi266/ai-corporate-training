<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Noto+Sans+SC:wght@500;700;900&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:"Plus Jakarta Sans","Noto Sans SC",sans-serif;
background:radial-gradient(700px 420px at 92% 0%,rgba(232,121,47,.35),transparent 60%),linear-gradient(150deg,#0b3a28,#0f4a33 60%,#145a3e);color:#fff;position:relative}
.logo{position:absolute;left:56px;top:44px;background:#fff;border-radius:16px;padding:10px 18px}
.logo img{height:58px;display:block}
.txt{position:absolute;left:56px;top:150px;width:640px}
.tag{color:#ffb27a;font-weight:700;letter-spacing:.14em;font-size:18px;text-transform:uppercase}
h1{font-size:54px;line-height:1.1;font-weight:800;margin:14px 0 12px;letter-spacing:-.02em}
h1 em{font-style:normal;color:#ffb27a}
.zh{font-family:"Noto Sans SC";font-weight:700;font-size:32px;color:rgba(255,255,255,.92)}
.row{position:absolute;left:56px;bottom:44px;display:flex;gap:12px}
.row span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:10px 18px;font-weight:700;font-size:19px}
.photo{position:absolute;right:56px;top:44px;width:390px;height:542px;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:top}
.name{position:absolute;right:76px;bottom:64px;background:#fff;color:#14211b;border-radius:14px;padding:10px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 10px 24px rgba(0,0,0,.25)}
.name img{width:50px;height:50px}.name b{display:block;font-size:20px}.name small{color:#58665f;font-size:15px}
</style></head><body>
<div class="logo"><img src="assets/dac-logo.png"></div>
<div class="txt"><div class="tag">Corporate AI Training</div>
<h1>Make AI your team's <em>everyday productivity partner.</em></h1>
<div class="zh">让AI成为团队每天的效率伙伴</div></div>
<div class="row"><span>HRD Corp Claimable</span><span>70% Hands-on</span><span>EN · 中文</span></div>
<div class="photo"><img src="assets/david-hooi.jpg"></div>
<div class="name"><img src="assets/hrdc-badge.png"><div><b>David Hooi</b><small>HRD Corp Accredited Trainer</small></div></div>
</body></html>
