<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;font-family:"Plus Jakarta Sans",sans-serif;color:#fff;position:relative;
background:radial-gradient(700px 420px at 92% 0%,rgba(232,121,47,.28),transparent 60%),linear-gradient(150deg,#0b3a28,#0f4a33 60%,#145a3e)}
.txt{position:absolute;left:56px;top:52px;width:640px}
.logo{display:inline-flex;background:#fff;border-radius:14px;padding:8px 14px;margin-bottom:26px}
.logo img{height:46px;display:block}
.tag{display:flex;align-items:center;gap:12px;color:#ffb27a;font-weight:700;letter-spacing:.12em;font-size:17px;text-transform:uppercase}
.tag::before{content:"";width:26px;height:2px;background:#ffb27a}
h1{font-size:60px;line-height:1.05;font-weight:800;margin:14px 0 0;letter-spacing:-.025em}
h1 em{font-style:normal;color:#ffb27a}
.sub{font-size:30px;font-weight:700;color:rgba(255,255,255,.82);margin-top:10px}
.tl{margin-top:22px;padding-left:16px;border-left:4px solid #e8792f;font-size:23px;font-weight:700}
.photo{position:absolute;right:48px;top:40px;width:420px;height:550px;border-radius:30px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.4)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:center 40%}
.chip{position:absolute;right:250px;bottom:62px;background:#fff;color:#14211b;border-radius:18px;padding:14px 22px 14px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 14px 30px rgba(0,0,0,.3)}
.chip img{width:62px;height:62px;border-radius:50%;object-fit:cover;object-position:top;border:3px solid #e8792f}
.chip small{display:block;font-size:13px;font-weight:700;letter-spacing:.1em;color:#c95f17;text-transform:uppercase}
.chip b{display:block;font-size:22px}
.chip span{display:block;font-size:15px;color:#58665f}
</style></head><body>
<div class="txt">
  <div class="logo"><img src="assets/dac-logo.png"></div>
  <div class="tag">2-Day Corporate Programme · HRD Corp Claimable</div>
  <h1>AI Productivity &amp; Automation <em>Mastery</em></h1>
  <div class="sub">for Modern Workforce</div>
  <div class="tl">Make AI your team's everyday productivity partner.</div>
</div>
<div class="photo"><img src="assets/course-hero.jpg"></div>
<div class="chip"><img src="assets/david-hooi.jpg"><div><small>Your Trainer</small><b>David Hooi</b><span>HRD Corp Accredited Trainer</span></div></div>
</body></html>
